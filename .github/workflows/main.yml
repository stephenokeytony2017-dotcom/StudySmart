name: Build StudySmart APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project ZIP
        uses: actions/checkout@v4

      - name: Extract StudySmart Android project
        run: |
          unzip -o StudySmart-LIVE-ACCOUNT-ANDROID.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudySmart-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
